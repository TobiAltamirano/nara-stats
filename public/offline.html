<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Sin conexión — Nara Stats</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        color: #372d2e;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        box-sizing: border-box;
      }
      .ball {
        width: 72px;
        height: 72px;
        border-radius: 999px;
        background: #372d2e;
        margin-bottom: 20px;
        position: relative;
      }
      .ball::before,
      .ball::after {
        content: "";
        position: absolute;
        border: 2px solid #ffffff;
      }
      .ball::before {
        left: 50%;
        top: 8%;
        bottom: 8%;
        width: 0;
        transform: translateX(-50%);
      }
      .ball::after {
        top: 50%;
        left: 8%;
        right: 8%;
        height: 0;
        transform: translateY(-50%);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: rgba(55, 45, 46, 0.65);
        margin: 0 0 24px;
        max-width: 280px;
        line-height: 1.5;
      }
      button {
        background: #372d2e;
        color: #ffffff;
        border: none;
        padding: 12px 24px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ball"></div>
      <h1>Sin conexión</h1>
      <p>
        No se pudo cargar esta pantalla porque no hay internet. Revisá tu
        conexión y volvé a intentar.
      </p>
      <button onclick="window.location.reload()">Reintentar</button>
    </div>
  </body>
</html>
